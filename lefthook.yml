#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  commands:
    typecheck:
      glob: "*.py"
      run: uvx ty@0.0.59 check {staged_files}
    lint:
      glob: "*.py"
      run: uvx ruff@0.15.21 check --fix --select I {staged_files} && git add {staged_files}
    format:
      glob: "*.py"
      run: uvx ruff@0.15.21 format {staged_files} && git add {staged_files}
    codespell:
      run: uvx codespell@2.4.3 --skip="tests/**,expl_mcp/openapi.json" --ignore-words-list="" {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --yes -p "@commitlint/cli@21.2.1" -p "@commitlint/config-conventional@21.2.0" -- commitlint --edit {1}
